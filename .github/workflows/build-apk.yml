name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download MediaPipe hand model
        env:
          HAND_MODEL_URL: ${{ secrets.HAND_MODEL_URL }}
        run: |
          mkdir -p app/src/main/assets
          if [ -z "$HAND_MODEL_URL" ]; then
            echo "::warning::Secret HAND_MODEL_URL no configurado. El APK se compila sin el modelo y fallará al iniciar."
          else
            curl -fL -o app/src/main/assets/hand_landmarker.task "$HAND_MODEL_URL"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-back-phone-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-back-tv-apk
          path: tv/build/outputs/apk/debug/tv-debug.apk
