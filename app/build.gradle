plugins {
    id 'com.android.application'
}

// Claves desde el archivo .env de la raíz del repo (no versionado).
// Si el archivo no existe (por ejemplo en CI sin secret), las claves quedan vacías.
def envProps = new Properties()
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    envFile.withInputStream { envProps.load(it) }
}
def youtubeKey = envProps.getProperty('YOUTUBE_API_KEY', '')

android {
    namespace 'com.jere.vrback'
    compileSdk 34

    defaultConfig {
        applicationId "com.jere.vrback"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        buildConfigField 'String', 'YOUTUBE_API_KEY', "\"${youtubeKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.6'

    // CameraX (cámara trasera)
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"

    // MediaPipe Hand Landmarker
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // Guava (ListenableFuture de CameraX)
    implementation 'com.google.guava:guava:33.2.1-android'
}
